<style>

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif}
  a{color:var(--a)}
  header{border-bottom:1px solid var(--line)}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px}
  .hd{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 0}
  .logo{font-family:Anton,Impact,sans-serif;font-size:28px;letter-spacing:3px}
  .logo span{color:var(--a)}
  .ig{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:2px solid var(--a);color:var(--tx);text-decoration:none;font-weight:700;letter-spacing:1px}
  .hero{padding:40px 0 24px}
  h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(40px,7vw,76px);line-height:1;margin:0}
  .hero p{color:var(--mut);font-size:17px;max-width:640px;line-height:1.5;margin:14px 0 0}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0 24px}
  .bar label{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:1.5px;color:var(--mut);flex:1 1 150px}
  .bar select{width:100%}
  .pocet{color:var(--mut);font-size:14px;padding-bottom:16px}
  .viac{display:block;margin:0 auto 60px;min-height:48px;padding:0 32px;background:transparent;color:var(--tx);border:1px solid var(--a);font:700 14px Inter,sans-serif;letter-spacing:1.5px;cursor:pointer}
  select{min-height:44px;background:var(--card);color:var(--tx);border:1px solid #3A3A3A;padding:0 12px;font:500 14px Inter,sans-serif}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding-bottom:60px}
  .car{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column}
  .gal{position:relative;aspect-ratio:4/3;background:#1A1A1A;overflow:hidden}
  .gal img{width:100%;height:100%;object-fit:cover;display:block}
  .gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:22px;cursor:pointer}
  .gal .p{left:0}.gal .n{right:0}
  .gal .cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);font-size:12px;padding:4px 8px}
  .tag{position:absolute;left:12px;top:12px;background:var(--a);color:#0B0B0B;font-weight:700;font-size:12px;letter-spacing:2px;padding:6px 10px}
  .bd{padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
  .nm{font-family:Anton,Impact,sans-serif;font-size:28px;line-height:1.05;letter-spacing:.5px}
  .vr{color:var(--mut);font-size:14px;letter-spacing:1px;margin-top:4px}
  .specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;border-top:1px solid var(--line);padding-top:14px}
  .specs div{font-size:14px}
  .specs span{display:block;font-size:11px;font-weight:600;letter-spacing:1.5px;color:var(--dim);margin-bottom:2px}
  .pr{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:14px}
  .pr .big{font-family:Anton,Impact,sans-serif;font-size:34px;color:var(--a)}
  .pr .sm{font-size:13px;color:var(--mut)}
  .cta{display:flex;align-items:center;justify-content:center;min-height:48px;background:var(--a);color:#0B0B0B;text-decoration:none;font-weight:700;letter-spacing:1.5px}
  footer{border-top:1px solid var(--line);color:var(--dim);font-size:13px;padding:24px 0 40px;line-height:1.6}
  .empty{color:var(--mut);padding:40px 0}
</style>

const IG = "_beastautomotive_";
let typ = "", palivo = "", kmDo = 0, filter = "", sort = "nove", cenaDo = 0, rokOd = 0, zobraz = 48, list = [];
const fmt = n => Math.round(n).toLocaleString("sk-SK").replace(/ /g," ") + " €";
function card(a){
  const el = document.createElement("article"); el.className = "car";
  let i = 0;
  const gal = document.createElement("div"); gal.className = "gal";
  const img = document.createElement("img"); img.loading = "lazy"; img.alt = a.nazov; img.src = a.fotky[0];
  gal.appendChild(img);
  const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = a.kat; gal.appendChild(tag);
  if (a.fotky.length > 1){
    const cnt = document.createElement("div"); cnt.className = "cnt";
    const upd = () => { img.src = a.fotky[i]; cnt.textContent = (i+1) + " / " + a.fotky.length; };
    for (const [c, d, t] of [["nav p",-1,"Predchádzajúca fotka"],["nav n",1,"Ďalšia fotka"]]){
      const b = document.createElement("button"); b.className = c; b.type = "button"; b.setAttribute("aria-label", t);
      b.textContent = d < 0 ? "‹" : "›";
      b.onclick = () => { i = (i + d + a.fotky.length) % a.fotky.length; upd(); };
      gal.appendChild(b);
    }
    gal.appendChild(cnt); upd();
  }
  el.appendChild(gal);
  const bd = document.createElement("div"); bd.className = "bd";
  const h = document.createElement("div");
  h.innerHTML = '<div class="nm"></div><div class="vr"></div>';
  h.querySelector(".nm").textContent = a.nazov;
  h.querySelector(".vr").textContent = a.verzia;
  bd.appendChild(h);
  const sp = document.createElement("div"); sp.className = "specs";
  for (const [l, v] of a.spec){ const d = document.createElement("div"); const s = document.createElement("span"); s.textContent = l; d.appendChild(s); d.appendChild(document.createTextNode(v)); sp.appendChild(d); }
  bd.appendChild(sp);
  const pr = document.createElement("div"); pr.className = "pr";
  pr.innerHTML = '<div class="sm">Súkromná osoba</div><div class="big"></div><div class="sm f"></div>';
  pr.querySelector(".big").textContent = fmt(a.cena_s);
  pr.querySelector(".f").textContent = "Firma (plátca DPH): " + fmt(a.cena_f);
  bd.appendChild(pr);
  const cta = document.createElement("a"); cta.className = "cta"; cta.href = "https://ig.me/m/" + IG; cta.textContent = "MÁM ZÁUJEM";
  bd.appendChild(cta);
  el.appendChild(bd);
  return el;
}
const kmAuta = a => +((a.spec.find(s => s[0] === "NAJAZDENÉ") || ["", ""])[1].replace(/\D/g, "")) || 0;
const rokAuta = a => +((a.spec.find(s => s[0] === "ROK") || [])[1]) || 0;
function render(){
  const g = document.getElementById("grid"); g.innerHTML = ""; zobraz = 48;
  list = AUTA.filter(a => (!filter || a.kat === filter) && (!cenaDo || a.cena_s <= cenaDo) && (!rokOd || rokAuta(a) >= rokOd)
    && (!typ || a.typ === typ) && (!palivo || a.palivo === palivo) && (!kmDo || kmAuta(a) <= kmDo));
  if (sort === "lacne") list.sort((x,y) => x.cena_s - y.cena_s);
  else if (sort === "drahe") list.sort((x,y) => y.cena_s - x.cena_s);
  else list.sort((x,y) => y.pridane - x.pridane);
  document.getElementById("pocet").textContent = list.length + " áut";
  if (!list.length){ g.innerHTML = '<p class="empty">Momentálne tu nič nie je.</p>'; }
  dopln(0);
}
// karty sa pridávajú po 48, aby sa stránka načítala rýchlo aj pri stovkách áut
function dopln(od){
  const g = document.getElementById("grid");
  list.slice(od, zobraz).forEach(a => g.appendChild(card(a)));
  document.getElementById("viac").style.display = zobraz < list.length ? "" : "none";
}
document.getElementById("viac").onclick = () => { const od = zobraz; zobraz += 48; dopln(od); };
document.getElementById("znacka").onchange = e => { filter = e.target.value; render(); };
document.getElementById("cena").onchange = e => { cenaDo = +e.target.value; render(); };
document.getElementById("rok").onchange = e => { rokOd = +e.target.value; render(); };
document.getElementById("typ").onchange = e => { typ = e.target.value; render(); };
document.getElementById("palivo").onchange = e => { palivo = e.target.value; render(); };
document.getElementById("km").onchange = e => { kmDo = +e.target.value; render(); };
document.getElementById("sort").onchange = e => { sort = e.target.value; render(); };
render();
</script>
